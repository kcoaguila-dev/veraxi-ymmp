          <path d="M10 96 C10 62 66 62 66 96 Z" fill="#881337" stroke="#F43F5E" stroke-width="2"/>
          <rect x="8" y="80" width="60" height="18" rx="4" fill="#4C0519"/>
          <text x="38" y="93" font-size="10" font-weight="800" fill="#FECDD3" text-anchor="middle">四国めたん</text>
