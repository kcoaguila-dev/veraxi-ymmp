          <path d="M10 96 C10 62 66 62 66 96 Z" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
          <rect x="8" y="80" width="60" height="18" rx="4" fill="#052E22"/>
          <text x="38" y="93" font-size="10" font-weight="800" fill="#A7F3D0" text-anchor="middle">ずんだもん</text>
