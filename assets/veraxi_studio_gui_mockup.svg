    <rect x="380" y="0" width="152" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="456" y="23" font-size="12.5" font-weight="700" fill="#E2E8F0" text-anchor="middle">📄 Premiere書き出し</text>
  </g>

