      <text x="492" y="33" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">🖼 スライド変更</text>

      <!-- Line 1: Zundamon -->
      <g transform="translate(12, 70)">
        <rect width="520" height="88" rx="8" fill="#151F32" stroke="#1E293B" stroke-width="1"/>
        <circle cx="32" cy="44" r="20" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
        <text x="32" y="48" font-size="10" font-weight="800" fill="#A7F3D0" text-anchor="middle">ずんだ</text>

        <text x="64" y="26" font-size="12" font-weight="700" fill="#34D399">ずんだもん</text>
        <rect x="134" y="12" width="66" height="20" rx="5" fill="#1E293B"/>
        <text x="167" y="26" font-size="10.5" fill="#FDE047" text-anchor="middle">😊 笑顔 ▾</text>

        <text x="64" y="52" font-size="14.5" font-weight="600" fill="#F8FAFC">みんな、AI自動化の衝撃は</text>
        <text x="64" y="74" font-size="14.5" font-weight="700" fill="#FDE047">ここまできたのだ！</text>

        <text x="466" y="26" font-size="11" fill="#64748B" text-anchor="end">23文字</text>
        <circle cx="490" cy="52" r="15" fill="#1E293B"/>
        <polygon points="487,46 496,52 487,58" fill="#10B981"/>
      </g>

      <!-- Line 2: Shikoku Metan (Currently Selected / Playing) -->
      <g transform="translate(12, 168)">
        <rect width="520" height="94" rx="8" fill="#1A2744" stroke="#3B82F6" stroke-width="1.8"/>
        <circle cx="32" cy="47" r="20" fill="#881337" stroke="#F43F5E" stroke-width="1.5"/>
        <text x="32" y="51" font-size="10" font-weight="800" fill="#FECDD3" text-anchor="middle">めたん</text>

        <text x="64" y="26" font-size="12" font-weight="700" fill="#FB7185">四国めたん</text>
        <rect x="134" y="12" width="66" height="20" rx="5" fill="#1E293B"/>
        <text x="167" y="26" font-size="10.5" fill="#E2E8F0" text-anchor="middle">😌 通常 ▾</text>

        <text x="64" y="54" font-size="14.5" font-weight="600" fill="#FFFFFF">はい、ローカル環境でも無料で</text>
