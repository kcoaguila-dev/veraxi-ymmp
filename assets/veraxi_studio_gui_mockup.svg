        <text x="292" y="268" font-size="15.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">「はい、ローカル環境でも無料で</text>
        <text x="292" y="294" font-size="15.5" font-weight="800" fill="#FECDD3" text-anchor="middle">全自動動画制作が可能ですわ。」</text>
