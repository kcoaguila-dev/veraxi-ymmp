        <rect x="212" y="156" width="160" height="24" rx="12" fill="#064E3B"/>
        <text x="292" y="172" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">サーバー代 0円 • 高速出力</text>

