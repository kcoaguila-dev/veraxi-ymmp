    <text x="98" y="23" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">⚡ 動画を生成 (プレビュー)</text>

    <!-- Divider between Generate and External Editors -->
    <line x1="210" y1="6" x2="210" y2="30" stroke="#334155" stroke-width="1"/>

    <!-- Open in YMM4 -->
    <rect x="224" y="0" width="146" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
