    <path d="M8 9 L14 20 L20 9" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="20" font-size="16" font-weight="800" fill="#F8FAFC">veraxi Studio</text>

    <line x1="162" y1="4" x2="162" y2="24" stroke="#334155" stroke-width="1"/>
    <text x="178" y="19" font-size="13.5" font-weight="600" fill="#E2E8F0">ずんだもんAI自動化解説</text>
