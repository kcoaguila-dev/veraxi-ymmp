      <text x="551" y="32" font-size="11.5" font-weight="600" fill="#38BDF8" text-anchor="middle">✏ サムネ編集</text>
      <line x1="0" y1="50" x2="632" y2="50" stroke="#1E293B" stroke-width="1"/>

