        <text x="14" y="96" font-size="16" font-weight="900" fill="#FFFFFF" stroke="#080C14" stroke-width="2" paint-order="stroke">AI動画自動化ツール</text>

        <circle cx="196" cy="78" r="28" fill="#A7F3D0" stroke="#FFFFFF" stroke-width="2"/>
        <text x="196" y="83" font-size="10" font-weight="900" fill="#064E3B" text-anchor="middle">ずんだもん</text>

