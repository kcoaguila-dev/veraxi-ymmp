name: Release Desktop (Windows x64)

on:
  push:
    tags:
      - 'v*-desktop'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python & PyInstaller dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,youtube]" pyinstaller

      - name: Build veraxi-sidecar executable
        run: python scripts/build_sidecar.py --clean

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri desktop installers
        working-directory: frontend
        run: npm run tauri build

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "main") {
            $conf = Get-Content "frontend/src-tauri/tauri.conf.json" | ConvertFrom-Json
            $tag = "v$($conf.version)-desktop"
          }
          $ver = $tag -replace '^v', '' -replace '-desktop$', ''
          $title = "Veraxi Studio v$ver Desktop (Windows x64)"
          $files = @(
            Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem "frontend/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          )
          if ($files.Count -eq 0) {
            throw "No Tauri installer bundles found."
          }
          $fileArgs = $files | ForEach-Object { $_.FullName }
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @fileArgs --clobber
          } else {
            gh release create $tag @fileArgs --title $title --generate-notes --latest
          }
