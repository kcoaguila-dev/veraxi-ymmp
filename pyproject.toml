[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veraxi-ymmp"
version = "0.1.0"
description = "Clean-architecture multi-target video production engine for YMM4 (.ymmp), Premiere Pro (FCPXML), After Effects (.jsx), MoviePy, B-Roll graphics, and YouTube thumbnails."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kazuo Coaguila", email = "kcoaguila@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pykakasi>=2.0",
    "mecab-python3>=1.0",
    "ipadic>=1.0",
    "alkana>=0.0.3",
    "requests>=2.28",
    "budoux>=0.9.0",
    "brotli>=1.0.9",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "moviepy>=2.0.0",
]

[project.scripts]
veraxi-ymmp = "veraxi_ymmp.cli:main"
veraxi-ymmp-mcp = "veraxi_ymmp.mcp_server:mcp.run"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-requests>=2.28",
    "pre-commit>=3.5",
    "detect-secrets>=1.5.0",
]
mcp = [
    "mcp>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
